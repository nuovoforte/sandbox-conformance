[project]
name = "sandbox-conformance"
version = "0.1.0"
description = "Conformance harness: real AI workloads and adversarial faults against a GPU sandbox platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Harness-only dependencies. Deliberately tiny: the orchestrator must be able to
# run from a laptop or CI runner with no ML stack installed at all.
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed INSIDE the sandbox, by the workload itself. Splitting these out is
# what keeps the orchestrator lightweight and independently runnable.
workloads = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "datasets>=2.21.0",
    "peft>=0.12.0",
    "trl>=0.10.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[project.scripts]
conformance = "conformance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"src/conformance/cli.py" = ["B008"]
"src/conformance/workloads/lora.py" = ["B008"]
"src/conformance/workloads/whisper.py" = ["B008"]
"src/conformance/workloads/embed_faiss.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
